<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Ingresar</h2>

    <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" name="username" [(ngModel)]="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </div>
</div>
