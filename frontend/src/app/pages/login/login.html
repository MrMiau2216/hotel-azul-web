<div class="pantalla-login">
  <div class="tarjeta-login">
    <h1 class="font-titulos">Hotel Costa Azul</h1>

    <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" name="username" [(ngModel)]="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required>
      </div>
      <button type="submit" class="btn btn-dorado w-100">Ingresar</button>
    </form>

    <p class="text-center mt-4 mb-0">
      <a routerLink="/" class="small">Volver al inicio</a>
    </p>
  </div>
</div>
